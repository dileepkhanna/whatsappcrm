# Add this inside your server block in Nginx configuration
# File: /etc/nginx/conf.d/whatscrm.conf or /etc/nginx/sites-available/eswarigroup

server {
    listen 80;
    listen 443 ssl http2;
    server_name eswarigroup.in www.eswarigroup.in;

    # SSL certificates (if using HTTPS)
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    # Media files - served directly by Nginx (better performance)
    location /media {
        alias /home/ec2-user/whatsappcrm/client/public/media;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Range";
        try_files $uri =404;
        
        # Enable range requests for video streaming
        add_header Accept-Ranges bytes;
    }

    location /meta-media {
        alias /home/ec2-user/whatsappcrm/client/public/meta-media;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Range";
        try_files $uri =404;
        
        # Enable range requests for video streaming
        add_header Accept-Ranges bytes;
    }

    # Proxy API requests to Node.js
    location /api {
        proxy_pass http://localhost:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeouts for file uploads
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }

    # Socket.io
    location /socket.io {
        proxy_pass http://localhost:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend (React/Vue app)
    location / {
        proxy_pass http://localhost:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Increase max upload size
    client_max_body_size 100M;
}
