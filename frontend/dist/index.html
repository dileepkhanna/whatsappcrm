    <div id="root">
      <!-- Pre-React splash: abstract orbiting-dots loader, replaced once the app mounts -->
      <style>
        @keyframes wacrm-orbit {
          0%   { transform: rotate(0deg)   translateX(22px) rotate(0deg); }
          100% { transform: rotate(360deg) translateX(22px) rotate(-360deg); }
        }
        @keyframes wacrm-pulse {
          0%   { transform: scale(0.6); opacity: 0.55; }
          70%  { transform: scale(1.25); opacity: 0; }
          100% { transform: scale(1.25); opacity: 0; }
        }
        @keyframes wacrm-dot { 0%,100% { transform: scale(0.7);} 50% { transform: scale(1);} }
        #wacrm-splash {
          position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
          background: #f6f8fa;
        }
        #wacrm-splash .stage { position: relative; width: 72px; height: 72px; display: grid; place-items: center; }
        #wacrm-splash .ring {
          position: absolute; width: 72px; height: 72px; border-radius: 50%;
          border: 2px solid rgba(0,128,105,0.30); animation: wacrm-pulse 1.6s ease-out infinite;
        }
        #wacrm-splash .orb { position: absolute; width: 14px; height: 14px; animation: wacrm-orbit 1.2s linear infinite; }
        #wacrm-splash .orb i {
          display: block; width: 100%; height: 100%; border-radius: 50%;
          animation: wacrm-dot 1.2s ease-in-out infinite;
        }
        #wacrm-splash .orb:nth-child(2)   { animation-delay: 0s; }
        #wacrm-splash .orb:nth-child(2) i { background: #008069; box-shadow: 0 0 8px #008069; animation-delay: 0s; }
        #wacrm-splash .orb:nth-child(3)   { animation-delay: -0.4s; }
        #wacrm-splash .orb:nth-child(3) i { background: #25d366; box-shadow: 0 0 8px #25d366; animation-delay: -0.4s; }
        #wacrm-splash .orb:nth-child(4)   { animation-delay: -0.8s; }
        #wacrm-splash .orb:nth-child(4) i { background: #00bfa5; box-shadow: 0 0 8px #00bfa5; animation-delay: -0.8s; }
        @media (prefers-color-scheme: dark) {
          #wacrm-splash { background: #0f1114; }
          #wacrm-splash .ring { border-color: rgba(37,211,102,0.35); }
          #wacrm-splash .orb:nth-child(2) i { background: #25d366; box-shadow: 0 0 8px #25d366; }
          #wacrm-splash .orb:nth-child(3) i { background: #128c7e; box-shadow: 0 0 8px #128c7e; }
          #wacrm-splash .orb:nth-child(4) i { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
        }
