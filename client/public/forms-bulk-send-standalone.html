<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Forms Bulk Send</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .form-group {
      margin-bottom: 24px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }
    
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    
    textarea {
      resize: vertical;
      font-family: monospace;
      min-height: 120px;
    }
    
    .hint {
      color: #999;
      font-size: 12px;
      margin-top: 6px;
    }
    
    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    
    .tab {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .tab.active {
      border-color: #667eea;
      background: #f0f4ff;
      color: #667eea;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    button {
      padding: 14px 28px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      width: 100%;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .result {
      margin-top: 24px;
      padding: 20px;
      border-radius: 8px;
      display: none;
    }
    
    .result.success {
      background: #f0fdf4;
      border: 2px solid #86efac;
      color: #166534;
    }
    
    .result.error {
      background: #fef2f2;
      border: 2px solid #fca5a5;
      color: #991b1b;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    
    .stat {
      padding: 12px;
      background: white;
      border-radius: 6px;
      text-align: center;
    }
    
    .stat-label {
      color: #999;
      font-size: 12px;
      margin-bottom: 4px;
    }
    
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #333;
    }
    
    .stat-value.success {
      color: #22c55e;
    }
    
    .stat-value.failed {
      color: #ef4444;
    }
    
    .loader {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .progress {
      display: none;
      text-align: center;
      margin: 24px 0;
    }
    
    .progress-text {
      color: #666;
      font-weight: 600;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📤 WhatsApp Forms Bulk Send</h1>
    <p class="subtitle">Send forms to multiple contacts at once</p>
    
    <div class="form-group">
      <label for="formSelect">Select Form *</label>
      <select id="formSelect">
        <option value="">Loading forms...</option>
      </select>
      <p class="hint">Choose the form you want to send</p>
    </div>
    
    <div class="tabs">
      <div class="tab active" onclick="switchTab('phonebook')">📚 Use Phonebook</div>
      <div class="tab" onclick="switchTab('custom')">📝 Custom Numbers</div>
    </div>
    
    <div id="phonebookTab" class="tab-content active">
      <div class="form-group">
        <label for="phonebookSelect">Select Phonebook *</label>
        <select id="phonebookSelect">
          <option value="">Loading...</option>
        </select>
        <p class="hint">All contacts in the phonebook will receive the form</p>
      </div>
    </div>
    
    <div id="customTab" class="tab-content">
      <div class="form-group">
        <label for="phoneNumbers">Phone Numbers (one per line) *</label>
        <textarea id="phoneNumbers" placeholder="919876543210
918765432109
917654321098"></textarea>
        <p class="hint">Format: Country code + number (e.g., 919876543210)</p>
      </div>
    </div>
    
    <button id="sendBtn" onclick="sendBulk()">📤 Send to All</button>
    
    <div class="progress" id="progress">
      <div class="loader"></div>
      <p class="progress-text" id="progressText">Sending forms...</p>
    </div>
    
    <div class="result" id="result"></div>
  </div>
  
  <script>
    let currentTab = 'phonebook';
    let token = null;
    
    // Get JWT token from localStorage
    function getToken() {
      try {
        const userData = localStorage.getItem('wacrm_user');
        if (userData) {
          try {
            const parsed = JSON.parse(userData);
            return parsed.token || userData;
          } catch {
            return userData;
          }
        }
      } catch (error) {
        console.error('Error getting token:', error);
      }
      return null;
    }
    
    // Switch tabs
    function switchTab(tab) {
      currentTab = tab;
      console.log('📑 Switched to tab:', tab);
      
      // Update tab buttons
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      
      // Find and activate the clicked tab
      if (tab === 'phonebook') {
        document.querySelectorAll('.tab')[0].classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
      }
      
      // Update tab content
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById(tab + 'Tab').classList.add('active');
    }
    
    // Load phonebooks
    async function loadPhonebooks() {
      const select = document.getElementById('phonebookSelect');
      token = getToken();
      
      if (!token) {
        select.innerHTML = '<option value="">Please login first</option>';
        return;
      }
      
      try {
        const response = await fetch('/api/phonebook/get_by_uid', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        const result = await response.json();
        
        if (result.success && result.data && result.data.length > 0) {
          select.innerHTML = '<option value="">-- Select Phonebook --</option>';
          result.data.forEach(pb => {
            const option = document.createElement('option');
            option.value = pb.id;
            option.textContent = `${pb.name} (${pb.contactCount || 0} contacts)`;
            select.appendChild(option);
          });
        } else {
          select.innerHTML = '<option value="">No phonebooks found</option>';
        }
      } catch (error) {
        console.error('Error loading phonebooks:', error);
        select.innerHTML = '<option value="">Error loading phonebooks</option>';
      }
    }
    
    // Load forms
    async function loadForms() {
      const select = document.getElementById('formSelect');
      token = getToken();
      
      if (!token) {
        select.innerHTML = '<option value="">Please login first</option>';
        return;
      }
      
      try {
        const response = await fetch('/api/waform/get-forms', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        const result = await response.json();
        
        if (result.success && result.data && result.data.length > 0) {
          select.innerHTML = '<option value="">-- Select Form --</option>';
          result.data.forEach(form => {
            const option = document.createElement('option');
            option.value = form.id;
            option.textContent = `${form.name} (${form.flow_status || 'DRAFT'})`;
            select.appendChild(option);
          });
        } else {
          select.innerHTML = '<option value="">No forms found</option>';
        }
      } catch (error) {
        console.error('Error loading forms:', error);
        select.innerHTML = '<option value="">Error loading forms</option>';
      }
    }
    
    // Send bulk forms
    async function sendBulk() {
      const formId = document.getElementById('formSelect').value;
      const sendBtn = document.getElementById('sendBtn');
      const progress = document.getElementById('progress');
      const progressText = document.getElementById('progressText');
      const result = document.getElementById('result');
      
      // Validate form ID
      if (!formId) {
        alert('Please select a form');
        return;
      }
      
      // Get data based on current tab
      let payload = { id: parseInt(formId) };
      
      console.log('📑 Current tab:', currentTab);
      
      if (currentTab === 'phonebook') {
        const phonebookId = document.getElementById('phonebookSelect').value;
        console.log('📚 Phonebook ID selected:', phonebookId);
        if (!phonebookId) {
          alert('Please select a phonebook');
          return;
        }
        payload.phonebookId = parseInt(phonebookId);
        progressText.textContent = 'Sending forms to phonebook...';
      } else {
        const phoneNumbersTextarea = document.getElementById('phoneNumbers');
        const phoneNumbersValue = phoneNumbersTextarea.value;
        
        console.log('📝 Textarea value:', phoneNumbersValue);
        console.log('📝 Textarea value length:', phoneNumbersValue.length);
        
        const phoneNumbers = phoneNumbersValue
          .split('\n')
          .map(n => n.trim())
          .filter(n => n && n.length > 0);
        
        console.log('📝 Parsed phone numbers:', phoneNumbers);
        console.log('📝 Count:', phoneNumbers.length);
        
        if (phoneNumbers.length === 0) {
          alert('Please enter at least one phone number\n\nDebug info:\nTextarea value: "' + phoneNumbersValue + '"\nLength: ' + phoneNumbersValue.length);
          return;
        }
        payload.phoneNumbers = phoneNumbers;
        progressText.textContent = `Sending forms to ${phoneNumbers.length} numbers...`;
      }
      
      // Show progress
      sendBtn.disabled = true;
      progress.style.display = 'block';
      result.style.display = 'none';
      
      token = getToken();
      if (!token) {
        alert('Please login first. Open the main app and login, then come back here.');
        sendBtn.disabled = false;
        progress.style.display = 'none';
        return;
      }
      
      try {
        const response = await fetch('/api/waform/send-form-bulk', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        
        const data = await response.json();
        
        // Hide progress
        progress.style.display = 'none';
        sendBtn.disabled = false;
        
        // Show result
        result.style.display = 'block';
        
        if (data.success) {
          result.className = 'result success';
          const successRate = ((data.results.success / data.results.total) * 100).toFixed(1);
          
          result.innerHTML = `
            <h3 style="margin-bottom: 16px;">✅ Bulk Send Complete!</h3>
            <div class="stats">
              <div class="stat">
                <div class="stat-label">Total</div>
                <div class="stat-value">${data.results.total}</div>
              </div>
              <div class="stat">
                <div class="stat-label">Success</div>
                <div class="stat-value success">${data.results.success}</div>
              </div>
              <div class="stat">
                <div class="stat-label">Failed</div>
                <div class="stat-value failed">${data.results.failed}</div>
              </div>
              <div class="stat">
                <div class="stat-label">Success Rate</div>
                <div class="stat-value">${successRate}%</div>
              </div>
            </div>
            ${data.results.errors && data.results.errors.length > 0 ? `
              <details style="margin-top: 16px;">
                <summary style="cursor: pointer; font-weight: 600;">
                  View Errors (${data.results.errors.length})
                </summary>
                <div style="margin-top: 12px; max-height: 200px; overflow-y: auto;">
                  ${data.results.errors.map(err => `
                    <div style="padding: 8px; background: #fef2f2; margin-top: 8px; border-radius: 4px; font-size: 13px;">
                      <strong>${err.phone}</strong>${err.name ? ` (${err.name})` : ''}<br>
                      <span style="color: #666;">${err.error}</span>
                    </div>
                  `).join('')}
                </div>
              </details>
            ` : ''}
          `;
        } else {
          result.className = 'result error';
          result.innerHTML = `
            <h3 style="margin-bottom: 12px;">❌ Error</h3>
            <p>${data.msg || 'Failed to send forms'}</p>
          `;
        }
      } catch (error) {
        progress.style.display = 'none';
        sendBtn.disabled = false;
        result.style.display = 'block';
        result.className = 'result error';
        result.innerHTML = `
          <h3 style="margin-bottom: 12px;">❌ Error</h3>
          <p>${error.message}</p>
        `;
      }
    }
    
    // Initialize
    loadPhonebooks();
    loadForms();
  </script>
</body>
</html>
