<!DOCTYPE html>
<html>
<head>
  <title>WhatsApp Connection Status</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .status {
      padding: 15px;
      margin: 10px 0;
      border-radius: 5px;
    }
    .success { background: #d4edda; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; border: 1px solid #f5c6cb; }
    .info { background: #d1ecf1; border: 1px solid #bee5eb; }
    pre {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 3px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>🔍 WhatsApp Connection Diagnostics</h1>
  
  <div id="results">
    <p>Loading...</p>
  </div>
  
  <script>
    async function checkConnection() {
      const resultsDiv = document.getElementById('results');
      let html = '';
      
      try {
        // Get token
        const token = localStorage.getItem('wacrm_user');
        
        if (!token) {
          html += '<div class="status error">❌ No authentication token found</div>';
          resultsDiv.innerHTML = html;
          return;
        }
        
        html += '<div class="status success">✅ Token found</div>';
        
        // Check Meta API keys
        const metaResponse = await fetch('/api/user/get_meta_keys', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        const metaData = await metaResponse.json();
        
        if (metaData.success && metaData.data) {
          html += '<div class="status success">✅ Meta API configured</div>';
          html += '<div class="status info">';
          html += '<h3>Meta API Details:</h3>';
          html += '<pre>' + JSON.stringify(metaData.data, null, 2) + '</pre>';
          html += '</div>';
          
          // Check if login_type is manual
          if (metaData.data.login_type === 'manual') {
            html += '<div class="status success">✅ Using Meta Cloud API (manual login)</div>';
          } else if (metaData.data.login_type === 'embed') {
            html += '<div class="status info">ℹ️ Using Meta Embed Login</div>';
          } else {
            html += '<div class="status error">⚠️ Unknown login type: ' + metaData.data.login_type + '</div>';
          }
          
        } else {
          html += '<div class="status error">❌ No Meta API keys found</div>';
          html += '<pre>' + JSON.stringify(metaData, null, 2) + '</pre>';
        }
        
        // Check if QR session exists (old method)
        html += '<div class="status info">';
        html += '<h3>Connection Type:</h3>';
        html += '<p>This system is trying to use <strong>Meta Cloud API</strong>.</p>';
        html += '<p>If you see "Session not found" error, it means the inbox is incorrectly trying to use QR-based WhatsApp Web instead of Meta API.</p>';
        html += '</div>';
        
        // Recommendations
        html += '<div class="status info">';
        html += '<h3>✅ Recommendations:</h3>';
        html += '<ol>';
        html += '<li><strong>Restart Node.js:</strong> Stop and start <code>node app.js</code></li>';
        html += '<li><strong>Clear browser cache:</strong> Ctrl+Shift+Delete</li>';
        html += '<li><strong>Check webhook:</strong> Make sure Meta is sending messages to your webhook</li>';
        html += '<li><strong>Test sending:</strong> Send a test message from another phone to your WhatsApp Business number</li>';
        html += '</ol>';
        html += '</div>';
        
      } catch (error) {
        html += '<div class="status error">❌ Error: ' + error.message + '</div>';
      }
      
      resultsDiv.innerHTML = html;
    }
    
    checkConnection();
  </script>
</body>
</html>
