/* Fallback for browsers that don't support custom cursors */
@supports not (cursor: url('data:image/svg+xml')) {
  body {
    cursor: default;

<script>
/* ========================================
   COMPREHENSIVE FIX: Sidebar & Search Issues
   - Fix 1: Prevent email auto-fill in search bar
   - Fix 2: Keep sidebar interactive after navigation
   ======================================== */
(function() {
  console.log('🔧 Initializing sidebar and search fixes...');
  
  // Special fix for Social Login menu item click
  function fixSocialLoginClick() {
    // Find all elements that might be the Social Login menu item
    const allClickables = document.querySelectorAll('a, button, [role="button"], li, div[class*="menu"]');
    
    allClickables.forEach(element => {
      const text = element.textContent || '';
      const href = element.getAttribute('href') || '';
      
      // Check if this is the Social Login menu item
      if ((text.toLowerCase().includes('social') && text.toLowerCase().includes('login')) ||
          href.includes('social-login')) {
        
        // Check if we already added our listener
        if (element.dataset.fixedClick === 'true') return;
        element.dataset.fixedClick = 'true';
        
        // Add our click handler in capture phase (runs before React's)
        element.addEventListener('click', function(e) {
          console.log('🎯 Social Login clicked - preventing search trigger');
          
          // Prevent the click from propagating to search
          e.stopPropagation();
          e.stopImmediatePropagation();
          e.preventDefault();
          
          // Navigate directly
          setTimeout(() => {
            window.location.hash = '';
            
            // For React Router, update the URL
            const newUrl = '/admin?page=social-login';
            if (window.location.pathname + window.location.search !== newUrl) {
              window.history.pushState(null, '', newUrl);
              window.dispatchEvent(new PopStateEvent('popstate'));
            }
            
            // Clear search immediately and multiple times
            for (let i = 0; i < 5; i++) {
              setTimeout(() => {
                clearEmailFromSearch();
                clearSearchResults();
              }, i * 100);
            }
          }, 0);
          
          return false;
        }, true); // Use capture phase - runs BEFORE React's handlers
        
        console.log('✅ Fixed Social Login menu item click handler');
      }
    });
  }
  
  // Run the fix after React renders
  setTimeout(fixSocialLoginClick, 2000);
  setTimeout(fixSocialLoginClick, 4000); // Run again to catch lazy-loaded elements
  
  // Re-run when DOM changes (React re-renders)
  let fixTimeout;
  const fixObserver = new MutationObserver(() => {
    clearTimeout(fixTimeout);
    fixTimeout = setTimeout(fixSocialLoginClick, 500);
  });
  
  if (document.body) {
    fixObserver.observe(document.body, { childList: true, subtree: true });
  }
  
  // Fix 1: Prevent email auto-fill in search bar
  function clearEmailFromSearch() {
    const searchInputs = document.querySelectorAll('input[type="search"], input[placeholder*="search" i]');
    searchInputs.forEach(input => {
      if (input.value && input.value.includes('@') && document.activeElement !== input) {
        console.log('🧹 Clearing email from search:', input.value);
        input.value = '';
        const event = new Event('input', { bubbles: true, cancelable: true });
        input.dispatchEvent(event);
      }
    });
    
    // Also clear any search results overlay/panel
    clearSearchResults();
  }
  
  // Clear search results panel that shows "No results found"
  function clearSearchResults() {
    // Strategy 1: Click the close/clear button if it exists
    const closeButtonSelectors = [
      'button[aria-label*="close" i]',
      'button[aria-label*="clear" i]',
      '[class*="close"]',
      '[class*="Clear"]',
      'button:has-text("×")',
      'button:has-text("✕")',
      '[class*="search"] button',
      'svg[class*="close"]'
    ];
    
    let closedSearch = false;
    closeButtonSelectors.forEach(selector => {
      try {
        const buttons = document.querySelectorAll(selector);
        buttons.forEach(btn => {
          // Check if this is near a search input
          const parent = btn.closest('[class*="search"], [class*="Search"]');
          if (parent && btn.offsetParent !== null) {
            console.log('🗑️ Clicking search close button');
            btn.click();
            closedSearch = true;
          }
        });
      } catch (e) {
        // Selector might not work, skip
      }
    });
    
    if (closedSearch) return;
    
    // Strategy 2: Hide search results overlay/panel
    const possibleResultSelectors = [
      '[class*="search-result"]',
      '[class*="searchResult"]',
      '[class*="SearchResult"]',
      '[class*="search-panel"]',
      '[class*="searchPanel"]',
      '[class*="no-result"]',
      '[class*="noResult"]'
    ];
    
    possibleResultSelectors.forEach(selector => {
      try {
        const elements = document.querySelectorAll(selector);
        elements.forEach(el => {
          // Check if it contains "No results" or similar text
          const text = el.textContent || '';
          if (text.toLowerCase().includes('no result') || 
              text.toLowerCase().includes('no menu') ||
              text.toLowerCase().includes('not found')) {
            // Hide the element
            if (el.style.display !== 'none' && el.offsetParent !== null) {
              console.log('🗑️ Hiding search results panel');
              el.style.display = 'none';
              el.style.visibility = 'hidden';
              el.style.opacity = '0';
              el.style.pointerEvents = 'none';
            }
          }
        });
      } catch (e) {
        // Selector might not be valid, skip
      }
    });
    
    // Strategy 3: Press Escape key to close search
    if (!closedSearch) {
      const searchInput = document.querySelector('input[type="search"], input[placeholder*="search" i]');
      if (searchInput && searchInput.value === '') {
        // Blur the input to close any dropdowns
        if (document.activeElement === searchInput) {
          searchInput.blur();
          console.log('🗑️ Blurred search input to close results');
        }
      }
    }
  }
  
  // Fix 2: Re-enable sidebar elements if they get disabled
  function ensureSidebarActive() {
    // Find sidebar elements
    const sidebarSelectors = [
      '[class*="sidebar"]',
      '[class*="Sidebar"]',
      'nav',
      'aside',
      '[role="navigation"]'
    ];
    
    sidebarSelectors.forEach(selector => {
      const elements = document.querySelectorAll(selector);
      elements.forEach(element => {
        // Remove pointer-events: none if applied
        if (window.getComputedStyle(element).pointerEvents === 'none') {
          console.log('🔓 Re-enabling sidebar element:', element.tagName);
          element.style.pointerEvents = 'auto';
        }
        
        // Remove disabled class patterns
        const classList = element.className || '';
        if (classList.includes('disabled') || classList.includes('Disabled')) {
          console.log('🔓 Removing disabled class from sidebar');
          element.className = classList.replace(/disabled|Disabled/gi, '');
        }
        
        // Ensure clickable children are active
        const clickables = element.querySelectorAll('a, button, [role="button"]');
        clickables.forEach(item => {
          if (window.getComputedStyle(item).pointerEvents === 'none') {
            item.style.pointerEvents = 'auto';
          }
          if (item.hasAttribute('disabled')) {
            item.removeAttribute('disabled');
          }
        });
      });
    });
  }
  
  // Run both fixes periodically
  setInterval(() => {
    clearEmailFromSearch();
    ensureSidebarActive();
    
    // Check if we're on social-login page and search is showing
    if (window.location.href.includes('social-login')) {
      const searchInput = document.querySelector('input[type="search"], input[placeholder*="search" i]');
      if (searchInput && (searchInput.value !== '' || searchInput === document.activeElement)) {
        console.log('⚠️ Search active on Social Login page, clearing...');
        searchInput.value = '';
        searchInput.blur();
        clearSearchResults();
      }
    }
  }, 500);
  
  // Also run on route changes
  let lastPath = window.location.href;
  setInterval(() => {
    if (window.location.href !== lastPath) {
      console.log('📍 Route changed to:', window.location.pathname + window.location.search);
      lastPath = window.location.href;
      
      setTimeout(() => {
        clearEmailFromSearch();
        ensureSidebarActive();
      }, 300);
    }
  }, 300);
  
  // Run on DOM changes (React re-renders)
  const observer = new MutationObserver(() => {
    ensureSidebarActive();
  });
  
  // Start observing when body is ready
  const startObserving = () => {
    if (document.body) {
      observer.observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['class', 'style', 'disabled']
      });
      console.log('✅ Sidebar protection active');
    }
  };
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startObserving);
  } else {
    startObserving();
  }
  
  console.log('✅ Fixes initialized - sidebar will stay active, search will stay clean');
})();
</script>

<!-- FIX: Populate "From" dropdown in Start New Conversation -->
<script>
(function() {
  console.log('🔧 Initializing "Start New Conversation" dropdown fix...');
  
  // Function to fetch and populate Meta API phone numbers
  async function populateFromDropdown() {
    try {
      // Get user token from localStorage
      let token = localStorage.getItem('wacrm_user');
      
      if (!token) {
        console.log('⚠️ No user token found in localStorage');
        return;
      }
      
      // If it's a JSON object, extract the token
      // Otherwise, use it directly (it's the JWT token itself)
      try {
        const userData = JSON.parse(token);
        if (userData.token) {
          token = userData.token;
        }
      } catch (e) {
        // Token is already a string (JWT token), use it directly
        console.log('✅ Using token directly from localStorage');
      }
      
      // Fetch Meta API keys
      const response = await fetch('/api/user/get_meta_keys', {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });
      
      if (!response.ok) {
        return;
      }
      
      const data = await response.json();
      
      if (!data.success || !data.data) {
        return;
      }
      
      // Find the "From" dropdown/select element
      // Try multiple possible selectors
      const selectors = [
        'select[name="from"]',
        'select[name="From"]',
        'select[id*="from" i]',
        'div[class*="MuiSelect"]',
        'input[placeholder*="from" i]',
        'select'
      ];
      
      // Convert data.data to array if it's an object
      const metaKeys = Array.isArray(data.data) ? data.data : [data.data];
      
      let foundDropdown = false;
      
      for (const selector of selectors) {
        const dropdowns = document.querySelectorAll(selector);
        
        for (const dropdown of dropdowns) {
          // Check if this is inside a dialog/modal for "Start New Conversation"
          const dialog = dropdown.closest('[role="dialog"], .MuiDialog-root, [class*="modal"], [class*="Modal"]');
          
          if (!dialog) continue;
          
          // Check if dialog contains text related to starting conversation
          const dialogText = dialog.textContent || '';
          if (!dialogText.toLowerCase().includes('conversation') && 
              !dialogText.toLowerCase().includes('from')) {
            continue;
          }
          
          // If it's a Material-UI Select, we need to handle it differently
          if (dropdown.classList.contains('MuiSelect-root') || 
              dropdown.closest('.MuiSelect-root')) {
            
            // Find the actual select element (might be hidden input)
            const selectRoot = dropdown.closest('.MuiSelect-root') || dropdown;
            const hiddenInput = selectRoot.querySelector('input[type="hidden"]');
            const displayDiv = selectRoot.querySelector('[role="combobox"]');
            
            if (displayDiv) {
              // Set display text
              const displayText = metaKeys[0].display_phone_number || 
                                  metaKeys[0].business_phone_number_id || 
                                  'WhatsApp Number';
              displayDiv.textContent = displayText;
              displayDiv.setAttribute('aria-label', displayText);
              
              // Set hidden value if input exists
              if (hiddenInput) {
                hiddenInput.value = metaKeys[0].business_phone_number_id;
              }
              
              // Store in dataset
              selectRoot.dataset.selectedValue = metaKeys[0].business_phone_number_id;
              selectRoot.dataset.phoneNumber = metaKeys[0].display_phone_number;
              selectRoot.dataset.phoneNumberId = metaKeys[0].business_phone_number_id;
              
              foundDropdown = true;
            }
            
            continue; // Skip the menu manipulation approach
          }
          // If it's a regular select element
          else if (dropdown.tagName === 'SELECT') {
            if (dropdown.options.length <= 1) {
              
              // Clear existing options
              dropdown.innerHTML = '<option value="">Select Phone Number</option>';
              
              // Convert data.data to array if it's an object
              const metaKeys = Array.isArray(data.data) ? data.data : [data.data];
              
              // Add options from API data
              metaKeys.forEach((item, index) => {
                const option = document.createElement('option');
                option.value = item.id || index;
                option.textContent = item.display_phone_number || item.business_phone_number_id || 'WhatsApp Number';
                option.dataset.phoneNumberId = item.business_phone_number_id;
                dropdown.appendChild(option);
              });
              
              foundDropdown = true;
            }
          }
        }
      }
      
    } catch (error) {
      // Silent error - don't log
    }
  }
  
  // ✅ ONLY run this fix on the inbox page
  function isInboxPage() {
    return window.location.href.includes('page=inbox') || 
           window.location.pathname.includes('/inbox');
  }
  
  // Monitor for dialog/modal opening
  const observer = new MutationObserver((mutations) => {
    if (!isInboxPage()) return; // Skip if not on inbox page
    
    mutations.forEach((mutation) => {
      mutation.addedNodes.forEach((node) => {
        if (node.nodeType === 1) { // Element node
          // Check if it's a dialog/modal
          if (node.matches && (
              node.matches('[role="dialog"]') || 
              node.matches('.MuiDialog-root') ||
              node.matches('[class*="modal"]') ||
              node.matches('[class*="Modal"]')
          )) {
            const text = node.textContent || '';
            if (text.toLowerCase().includes('conversation') || text.toLowerCase().includes('from')) {
              setTimeout(populateFromDropdown, 500);
              setTimeout(populateFromDropdown, 1000);
              setTimeout(populateFromDropdown, 2000);
            }
          }
        }
      });
    });
  });
  
  // Start observing when body is ready AND on inbox page
  const startObserving = () => {
    if (!isInboxPage()) {
      // Don't log anything if not on inbox page
      return;
    }
    
    if (document.body) {
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    }
  };
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startObserving);
  } else {
    startObserving();
  }
  
  // Also try to populate on any button click that might open the dialog (ONLY on inbox page)
  document.addEventListener('click', (e) => {
    if (!isInboxPage()) return;
    
    const target = e.target;
    const text = target.textContent || '';
    
    if (text.toLowerCase().includes('conversation') || 
        text.toLowerCase().includes('new message')) {
      setTimeout(populateFromDropdown, 500);
      setTimeout(populateFromDropdown, 1000);
    }
  }, true);
  
  // Check URL changes for SPA
  let lastUrl = location.href;
  new MutationObserver(() => {
    const url = location.href;
    if (url !== lastUrl) {
      lastUrl = url;
      if (isInboxPage()) {
        startObserving();
      }
    }
  }).observe(document, {subtree: true, childList: true});
})();
</script>

<!-- ========================================
     PHONEBOOK FIX - Intercept and Fix UI
     ======================================== -->
<script>
(function() {
  'use strict';
  
  console.log('🔧 Phonebook Fix Loaded');
  
  // Wait for React to load
  function waitForReact() {
    if (window.location.href.includes('page=phonebook')) {
      console.log('📒 On phonebook page, applying fixes...');
      
      // Monitor for "Add Phonebook" dialog
      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          mutation.addedNodes.forEach((node) => {
            if (node.nodeType === 1) {
              // Check if it's the phonebook dialog
              if (node.matches && (
                  node.matches('[role="dialog"]') || 
                  node.matches('.MuiDialog-root')
              )) {
                const dialogText = node.textContent || '';
                if (dialogText.toLowerCase().includes('phonebook')) {
                  console.log('📒 Phonebook dialog detected, fixing...');
                  fixPhonebookDialog(node);
                }
              }
            }
          });
        });
      });
      
      if (document.body) {
        observer.observe(document.body, {
          childList: true,
          subtree: true
        });
      }
      
      // Also fix any existing "Add Phonebook" buttons
      setTimeout(() => {
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
          const text = btn.textContent || '';
          if (text.toLowerCase().includes('add phonebook') || 
              text.toLowerCase().includes('phonebook') ||
              text.toLowerCase().includes('add contact')) {
            console.log('📒 Found button:', text);
            
            // Remove existing listeners and add new one
            const newBtn = btn.cloneNode(true);
            btn.parentNode?.replaceChild(newBtn, btn);
            
            newBtn.addEventListener('click', (e) => {
              console.log('📒 Phonebook button clicked:', text);
              
              // Prevent default behavior
              e.preventDefault();
              e.stopPropagation();
              
              // Open our helper page instead
              if (text.toLowerCase().includes('add phonebook')) {
                handleAddPhonebook();
              } else if (text.toLowerCase().includes('add contact')) {
                handleAddContact();
              }
            }, true);
          }
        });
      }, 2000);
    }
  }
  
  function fixPhonebookDialog(dialog) {
    // Find the form in the dialog
    const forms = dialog.querySelectorAll('form');
    forms.forEach(form => {
      console.log('📋 Found form in phonebook dialog');
      
      // Prevent default form submission
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        
        console.log('📋 Form submitted, handling manually...');
        
        // Get form data
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        
        console.log('📋 Form data:', data);
        
        // Get JWT token
        const token = getJWTToken();
        if (!token) {
          alert('Please login first');
          return;
        }
        
        // Determine if it's phonebook or contact
        if (data.name && !data.mobile) {
          // Creating phonebook

})();

        }
      }
      
      await sendBulkForms(formId, phonebookId, phoneNumbers, content);
    };
    
    // Close on backdrop click (but not when clicking content)
    modal.onclick = function(e) {
      if (e.target === modal) {
        modal.remove();
      }
    };
    
    // Prevent clicks on content from closing modal
    content.onclick = function(e) {
      e.stopPropagation();
    };
  }
  
  async function loadPhonebooks() {
    const select = document.querySelector('#phonebookSelect');
    if (!select) return;
    
    const token = getJWTToken();
    if (!token) {
      select.innerHTML = '<option value="">Please login</option>';
      return;
    }
    
    try {
      const response = await fetch('/api/phonebook/get_by_uid', {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });
      
      const result = await response.json();
      
      if (result.success && result.data && result.data.length > 0) {
        select.innerHTML = '<option value="">-- Select Phonebook --</option>';
        result.data.forEach(pb => {
          const option = document.createElement('option');
          option.value = pb.id;
          option.textContent = `${pb.name} (${pb.contactCount || 0} contacts)`;
          select.appendChild(option);
        });
      } else {
        select.innerHTML = '<option value="">No phonebooks found</option>';
      }
    } catch (error) {
      console.error('Error loading phonebooks:', error);
      select.innerHTML = '<option value="">Error loading phonebooks</option>';
    }
  }
  
  async function sendBulkForms(formId, phonebookId, phoneNumbers, contentEl) {
    const sendBtn = contentEl.querySelector('#sendBulkBtn');
    const cancelBtn = contentEl.querySelector('#cancelBtn');
    const progressSection = contentEl.querySelector('#progressSection');
    const resultSection = contentEl.querySelector('#resultSection');
    const progressText = contentEl.querySelector('#progressText');
    
    // Disable buttons and show progress
    sendBtn.disabled = true;
    cancelBtn.disabled = true;
    sendBtn.style.opacity = '0.5';
    cancelBtn.style.opacity = '0.5';
    progressSection.style.display = 'block';
    resultSection.style.display = 'none';
    
    const token = getJWTToken();
    if (!token) {
      alert('Please login first');
      return;
    }
    
    try {
      const payload = { id: formId };
      if (phonebookId) {
        payload.phonebookId = parseInt(phonebookId);
        progressText.textContent = 'Sending forms to phonebook...';
      } else {
        payload.phoneNumbers = phoneNumbers;
        progressText.textContent = `Sending forms to ${phoneNumbers.length} numbers...`;
      }
      
      console.log('📤 Sending bulk forms:', payload);
      
      const response = await fetch('/api/waform/send-form-bulk', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      
      const result = await response.json();
      console.log('📊 Result:', result);
      
      // Hide progress
      progressSection.style.display = 'none';
      
      // Show results
      resultSection.style.display = 'block';
      const resultContent = contentEl.querySelector('#resultContent');
      
      if (result.success) {
        const successRate = ((result.results.success / result.results.total) * 100).toFixed(1);
        
        resultContent.innerHTML = `
          <div style="padding: 20px; background: #f0fdf4; border: 2px solid #86efac; border-radius: 8px;">
            <h3 style="margin: 0 0 16px 0; color: #166534; font-size: 18px;">
              ✅ Bulk Send Complete!
            </h3>
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px;">
              <div style="padding: 12px; background: white; border-radius: 6px;">
                <div style="color: #999; font-size: 12px;">Total</div>
                <div style="color: #333; font-size: 24px; font-weight: 700;">${result.results.total}</div>
              </div>
              <div style="padding: 12px; background: white; border-radius: 6px;">
                <div style="color: #999; font-size: 12px;">Success</div>
                <div style="color: #22c55e; font-size: 24px; font-weight: 700;">${result.results.success}</div>
              </div>
              <div style="padding: 12px; background: white; border-radius: 6px;">
                <div style="color: #999; font-size: 12px;">Failed</div>
                <div style="color: #ef4444; font-size: 24px; font-weight: 700;">${result.results.failed}</div>
              </div>
              <div style="padding: 12px; background: white; border-radius: 6px;">
                <div style="color: #999; font-size: 12px;">Success Rate</div>
                <div style="color: #333; font-size: 24px; font-weight: 700;">${successRate}%</div>
              </div>
            </div>
            ${result.results.errors && result.results.errors.length > 0 ? `
              <details style="margin-top: 16px;">
                <summary style="cursor: pointer; color: #ef4444; font-weight: 600;">
                  View Errors (${result.results.errors.length})
                </summary>
                <div style="margin-top: 12px; max-height: 200px; overflow-y: auto;">
                  ${result.results.errors.map(err => `
                    <div style="padding: 8px; background: #fef2f2; border-left: 3px solid #ef4444; margin-bottom: 8px; font-size: 13px;">
                      <strong>${err.phone}</strong>${err.name ? ` (${err.name})` : ''}<br>
                      <span style="color: #666;">${err.error}</span>
                    </div>
                  `).join('')}
                </div>
              </details>
            ` : ''}
          </div>
        `;
        
        // Enable close button
        cancelBtn.disabled = false;
        cancelBtn.style.opacity = '1';
        cancelBtn.textContent = 'Close';
        sendBtn.style.display = 'none';
        
      } else {
        resultContent.innerHTML = `
          <div style="padding: 20px; background: #fef2f2; border: 2px solid #fca5a5; border-radius: 8px;">
            <h3 style="margin: 0 0 12px 0; color: #991b1b; font-size: 18px;">
              ❌ Error
            </h3>
            <p style="margin: 0; color: #666;">
              ${result.msg || 'Failed to send forms'}
            </p>
          </div>
        `;
        
        // Re-enable buttons
        sendBtn.disabled = false;
        cancelBtn.disabled = false;
        sendBtn.style.opacity = '1';
        cancelBtn.style.opacity = '1';
      }
      
    } catch (error) {
      console.error('Error sending bulk forms:', error);
      
      progressSection.style.display = 'none';
      resultSection.style.display = 'block';
      
      contentEl.querySelector('#resultContent').innerHTML = `
        <div style="padding: 20px; background: #fef2f2; border: 2px solid #fca5a5; border-radius: 8px;">
          <h3 style="margin: 0 0 12px 0; color: #991b1b; font-size: 18px;">
            ❌ Error
          </h3>
          <p style="margin: 0; color: #666;">
            ${error.message}
          </p>
        </div>
      `;
      
      // Re-enable buttons
      sendBtn.disabled = false;
      cancelBtn.disabled = false;
      sendBtn.style.opacity = '1';
      cancelBtn.style.opacity = '1';
    }
  }
  
  // Start monitoring
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', monitorFormsDialog);
  } else {
    monitorFormsDialog();
  }
  
  console.log('✅ WhatsApp Forms Bulk Send ready');
})();
</script>
