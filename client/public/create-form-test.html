<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test WA Form Creation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background: #1976d2;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #1565c0;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 4px;
      display: none;
    }
    .result.success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      display: block;
    }
    .result.error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
      display: block;
    }
    .log {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      padding: 15px;
      margin-top: 20px;
      font-family: monospace;
      font-size: 12px;
      max-height: 400px;
      overflow-y: auto;
    }
    .log-entry {
      margin-bottom: 5px;
    }
    .log-entry.error {
      color: #dc3545;
    }
    .log-entry.success {
      color: #28a745;
    }
    .log-entry.info {
      color: #17a2b8;
    }
  </style>
</head>
<body>
  <h1>Test WA Form Creation</h1>
  <p>This standalone page tests the WA Forms API directly to see what's causing the creation issue.</p>

  <div class="form-group">
    <label for="formName">Form Name *</label>
    <input type="text" id="formName" placeholder="e.g. Contact Us Form" value="Test Form">
  </div>

  <div class="form-group">
    <label for="formDescription">Description (optional)</label>
    <textarea id="formDescription" rows="3" placeholder="Brief description of the form"></textarea>
  </div>

  <button id="createBtn" onclick="createForm()">Create Form (No Fields)</button>

  <div id="result" class="result"></div>

  <div class="log" id="log"></div>

  <script>
    const logEl = document.getElementById('log');
    const resultEl = document.getElementById('result');

    function log(message, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
      console.log(message);
    }

    function showResult(message, isSuccess) {
      resultEl.textContent = message;
      resultEl.className = `result ${isSuccess ? 'success' : 'error'}`;
    }

    async function createForm() {
      const btn = document.getElementById('createBtn');
      btn.disabled = true;
      btn.textContent = 'Creating...';
      
      resultEl.style.display = 'none';
      logEl.innerHTML = '';

      try {
        const formName = document.getElementById('formName').value.trim();
        const formDescription = document.getElementById('formDescription').value.trim();

        log('Starting form creation test...', 'info');
        log(`Form Name: "${formName}"`, 'info');
        log(`Description: "${formDescription}"`, 'info');
        log('Fields: [] (empty - testing minimal form)', 'info');

        if (!formName) {
          throw new Error('Form name is required');
        }

        // Get token from localStorage
        const token = localStorage.getItem('wacrm_user');
        if (!token) {
          throw new Error('Not logged in - no token found in localStorage');
        }
        log('✅ Token found in localStorage', 'success');

        const payload = {
          name: formName,
          description: formDescription,
          fields: [] // Empty array - testing minimal form
        };

        log('Payload: ' + JSON.stringify(payload, null, 2), 'info');
        log('Sending POST request to /api/waform/create-form...', 'info');

        const response = await fetch('/api/waform/create-form', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        log(`Response status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');

        const data = await response.json();
        log('Response data: ' + JSON.stringify(data, null, 2), data.success ? 'success' : 'error');

        if (data.success) {
          showResult(`✅ Form created successfully! Flow ID: ${data.flowId}`, true);
          log(`✅ SUCCESS! Flow ID: ${data.flowId}`, 'success');
        } else {
          showResult(`❌ Error: ${data.msg}`, false);
          log(`❌ ERROR: ${data.msg}`, 'error');
          if (data.error) {
            log('Error details: ' + JSON.stringify(data.error, null, 2), 'error');
          }
          if (data.errorDetails) {
            log('Error details: ' + JSON.stringify(data.errorDetails, null, 2), 'error');
          }
        }

      } catch (error) {
        log(`❌ EXCEPTION: ${error.message}`, 'error');
        log('Stack: ' + error.stack, 'error');
        showResult(`❌ Error: ${error.message}`, false);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Form (No Fields)';
      }
    }

    // Log initial state
    log('=== WA Form Creation Test Page Loaded ===', 'info');
    log('This page will show detailed logs of the API call', 'info');
    log('Ready to test!', 'success');
  </script>
</body>
</html>
