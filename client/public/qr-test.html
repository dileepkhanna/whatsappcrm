<!DOCTYPE html>
<html>
<head>
  <title>QR Test - Direct Socket Connection</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1e1e1e;
      color: #fff;
    }
    .log { 
      background: #2d2d2d; 
      padding: 10px; 
      margin: 5px 0; 
      border-left: 3px solid #4CAF50;
    }
    .error { border-left-color: #f44336; }
    .warning { border-left-color: #ff9800; }
    img { 
      max-width: 300px; 
      background: white; 
      padding: 20px; 
      margin: 20px 0;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 5px;
    }
  </style>
</head>
<body>
  <h1>🧪 QR Code Direct Test</h1>
  <div id="logs"></div>
  <div>
    <button onclick="testConnection()">1. Test Connection</button>
    <button onclick="generateQR()">2. Generate QR</button>
  </div>
  <div id="qr-display"></div>
  
  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket = null;
    const sessionId = 'test_' + Date.now();
    
    function log(message, type = 'log') {
      const div = document.createElement('div');
      div.className = 'log ' + type;
      div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
      document.getElementById('logs').appendChild(div);
      console.log(message);
      
      // Auto-scroll
      div.scrollIntoView({ behavior: 'smooth' });
    }
    
    function testConnection() {
      log('🔌 Testing Socket.IO connection...');
      
      // Get token
      const token = localStorage.getItem('wacrm_user');
      if (!token) {
        log('❌ No token found. Please login first!', 'error');
        return;
      }
      
      log('✅ Token found: ' + token.substring(0, 20) + '...');
      
      // Connect
      log('🔌 Connecting to Socket.IO...');
      socket = io({
        query: { token }
      });
      
      socket.on('connect', () => {
        log('✅ Socket.IO connected! ID: ' + socket.id);
      });
      
      socket.on('connect_error', (error) => {
        log('❌ Connection error: ' + error.message, 'error');
      });
      
      socket.on('disconnect', (reason) => {
        log('⚠️ Disconnected: ' + reason, 'warning');
      });
      
      socket.on('connection_ack', (data) => {
        log('📨 Connection ACK: ' + JSON.stringify(data));
      });
      
      // Listen for QR
      socket.on('qr', (data) => {
        log('📱 QR CODE RECEIVED!');
        log('   Session: ' + data.sessionId);
        log('   QR length: ' + data.qr.length + ' chars');
        
        // Display QR
        const qrDiv = document.getElementById('qr-display');
        qrDiv.innerHTML = '<h2>✅ QR Code:</h2><img src="' + data.qr + '" />';
      });
      
      socket.on(`qr-${sessionId}`, (data) => {
        log('📱 QR CODE RECEIVED (session-specific)!');
        
        // Display QR
        const qrDiv = document.getElementById('qr-display');
        qrDiv.innerHTML = '<h2>✅ QR Code:</h2><img src="' + data.qr + '" />';
      });
      
      log('✅ Socket listeners registered');
    }
    
    async function generateQR() {
      if (!socket || !socket.connected) {
        log('❌ Socket not connected! Click "Test Connection" first.', 'error');
        return;
      }
      
      log('🚀 Requesting QR code generation...');
      log('   Session ID: ' + sessionId);
      
      try {
        const token = localStorage.getItem('wacrm_user');
        const response = await fetch('/api/qr/create?id=' + sessionId, {
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });
        
        const result = await response.json();
        log('📊 Server response: ' + JSON.stringify(result));
        
        if (result.success) {
          log('✅ QR generation started!');
          log('⏳ Waiting for QR code via Socket.IO...');
          log('   (Should appear within 10 seconds)');
        } else {
          log('❌ Server error: ' + result.msg, 'error');
        }
      } catch (error) {
        log('❌ Request failed: ' + error.message, 'error');
      }
    }
    
    // Auto-test on load
    window.addEventListener('load', () => {
      log('🌐 Page loaded');
      log('💡 Instructions:');
      log('   1. Click "Test Connection" to connect Socket.IO');
      log('   2. Wait for ✅ Socket.IO connected message');
      log('   3. Click "Generate QR" to request QR code');
      log('   4. QR code should appear below within 10 seconds');
      log('');
      log('📝 Make sure you are logged in to WhatsCRM first!');
    });
  </script>
</body>
</html>
