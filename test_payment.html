<!DOCTYPE html>
<html>
<head>
    <title>Test Payment Flow</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
    <h1>Payment Flow Test</h1>
    <button onclick="testPayment()">Test Payment with Plan Rs 2</button>
    
    <div id="output"></div>

    <script>
        async function testPayment() {
            const output = document.getElementById('output');
            
            try {
                // Step 1: Fetch web_public to see exchange_rate
                output.innerHTML += '<h3>Step 1: Fetching web_public...</h3>';
                const webRes = await fetch('http://localhost:3010/api/web/get_web_public');
                const webData = await webRes.json();
                output.innerHTML += `<pre>${JSON.stringify(webData, null, 2)}</pre>`;
                
                const exchangeRate = parseFloat(webData.data.exchange_rate);
                const currencySymbol = webData.data.currency_symbol;
                output.innerHTML += `<p><strong>Exchange Rate from API: ${exchangeRate}</strong></p>`;
                
                // Step 2: Fetch plan
                output.innerHTML += '<h3>Step 2: Fetching plan ID 3...</h3>';
                const planRes = await fetch('http://localhost:3010/api/web/get_plan_by_id?id=3');
                const planData = await planRes.json();
                output.innerHTML += `<pre>${JSON.stringify(planData, null, 2)}</pre>`;
                
                const planPrice = parseFloat(planData.data.price);
                output.innerHTML += `<p><strong>Plan Price from API: ${planPrice}</strong></p>`;
                
                // Step 3: Calculate what frontend would calculate
                const frontendCalculatedAmount = planPrice * exchangeRate;
                output.innerHTML += `<p><strong>Frontend Calculation: ${planPrice} × ${exchangeRate} = ${currencySymbol}${frontendCalculatedAmount}</strong></p>`;
                
                // Step 4: What we SHOULD show in Razorpay (database price)
                const correctAmount = planPrice; // Should be 2
                output.innerHTML += `<p><strong style="color: green;">Correct Amount for Razorpay: ${currencySymbol}${correctAmount}</strong></p>`;
                
                // Step 5: Show what the issue is
                if (exchangeRate != 1.0) {
                    output.innerHTML += `<p style="color: red;"><strong>❌ ISSUE: Exchange rate is ${exchangeRate}, not 1.0! Frontend will multiply and show Rs ${frontendCalculatedAmount}</strong></p>`;
                } else {
                    output.innerHTML += `<p style="color: green;"><strong>✅ GOOD: Exchange rate is 1.0, amounts should match!</strong></p>`;
                }
                
            } catch (err) {
                output.innerHTML += `<p style="color: red;">Error: ${err.message}</p>`;
            }
        }
    </script>
</body>
</html>
