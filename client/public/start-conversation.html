<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start New Conversation - WhatsCRM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .success {
            background: #4caf50 !important;
        }
        
        .error {
            background: #f44336 !important;
        }
        
        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        
        .info-box p {
            color: #555;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        #status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            text-align: center;
        }
        
        #status.show {
            display: block;
        }
        
        #status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        #status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 Start New Conversation</h1>
            <p>Send a message via Meta API WhatsApp</p>
        </div>
        
        <div class="info-box">
            <div class="badge">Meta API</div>
            <p id="phoneNumber">Loading phone number...</p>
        </div>
        
        <form id="conversationForm">
            <div class="form-group">
                <label for="toNumber">📞 To (Phone Number)</label>
                <input 
                    type="tel" 
                    id="toNumber" 
                    placeholder="e.g., 919876543210 or 918501010528"
                    required
                />
                <small style="color: #666; font-size: 12px; display: block; margin-top: 5px;">
                    Enter number with country code (no + or spaces)
                </small>
            </div>
            
            <div class="form-group">
                <label for="toName">👤 Contact Name (Optional)</label>
                <input 
                    type="text" 
                    id="toName" 
                    placeholder="e.g., John Doe"
                />
            </div>
            
            <div class="form-group">
                <label for="message">💬 Message</label>
                <textarea 
                    id="message" 
                    placeholder="Type your message here..."
                    required
                ></textarea>
            </div>
            
            <button type="submit" class="btn" id="sendBtn">
                📤 Send Message
            </button>
            
            <div id="status"></div>
        </form>
        
        <div class="back-link">
            <a href="/user?page=inbox">← Back to Inbox</a>
        </div>
    </div>
    
    <script>
        // Get token from localStorage
        const token = localStorage.getItem('wacrm_user');
        
        if (!token) {
            alert('Not logged in! Redirecting to login...');
            window.location.href = '/';
        }
        
        // Load Meta API phone number
        async function loadPhoneNumber() {
            try {
                const response = await fetch('/api/user/get_meta_keys', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.success && data.data && data.data.display_phone_number) {
                    document.getElementById('phoneNumber').innerHTML = 
                        `<strong>From:</strong> ${data.data.display_phone_number}`;
                    return true;
                } else {
                    document.getElementById('phoneNumber').innerHTML = 
                        '<span style="color: red;">⚠️ Meta API not configured</span>';
                    return false;
                }
            } catch (error) {
                console.error('Error loading phone number:', error);
                document.getElementById('phoneNumber').innerHTML = 
                    '<span style="color: red;">⚠️ Error loading Meta API</span>';
                return false;
            }
        }
        
        // Load on page load
        loadPhoneNumber();
        
        // Handle form submission
        document.getElementById('conversationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const sendBtn = document.getElementById('sendBtn');
            const status = document.getElementById('status');
            const toNumber = document.getElementById('toNumber').value.trim();
            const toName = document.getElementById('toName').value.trim() || toNumber;
            const message = document.getElementById('message').value.trim();
            
            if (!toNumber || !message) {
                showStatus('Please fill in all required fields', 'error');
                return;
            }
            
            // Clean phone number (remove any non-digits)
            const cleanNumber = toNumber.replace(/[^\d]/g, '');
            
            if (cleanNumber.length < 10) {
                showStatus('Please enter a valid phone number', 'error');
                return;
            }
            
            // Show loading
            sendBtn.textContent = '⏳ Sending...';
            sendBtn.disabled = true;
            status.classList.remove('show');
            
            try {
                const chatId = `meta_${cleanNumber}`;
                
                const response = await fetch('/api/inbox/send_text', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: message,
                        toNumber: cleanNumber,
                        toName: toName,
                        chatId: chatId
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    sendBtn.textContent = '✅ Message Sent!';
                    sendBtn.classList.add('success');
                    showStatus('Message sent successfully! Redirecting to inbox...', 'success');
                    
                    // Clear form
                    document.getElementById('message').value = '';
                    
                    // Redirect to inbox after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/user?page=inbox';
                    }, 2000);
                } else {
                    throw new Error(result.msg || 'Failed to send message');
                }
            } catch (error) {
                console.error('Error sending message:', error);
                sendBtn.textContent = '❌ Send Failed';
                sendBtn.classList.add('error');
                showStatus(`Error: ${error.message}`, 'error');
                
                // Reset button after 3 seconds
                setTimeout(() => {
                    sendBtn.textContent = '📤 Send Message';
                    sendBtn.classList.remove('error');
                    sendBtn.disabled = false;
                }, 3000);
            }
        });
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `show ${type}`;
        }
    </script>
</body>
</html>
